<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matematyczni Detektywi</title>
<style>
:root{
 --bg:#10162e;--panel:#20294c;--panel2:#29365e;
 --gold:#ffd166;--blue:#69c6ff;--green:#6be7a8;
 --red:#ff7b91;--text:#f5f7ff;--muted:#aebbe0;
}
*{box-sizing:border-box}
body{
 margin:0;background:radial-gradient(circle at top,#293a70,#10162e 70%);
 color:var(--text);font-family:system-ui,Arial,sans-serif;
 min-height:100vh;
}
button{font:inherit;cursor:pointer}
header{
 padding:16px;display:flex;align-items:center;justify-content:space-between;
 gap:12px;flex-wrap:wrap;max-width:1100px;margin:auto
}
.logo{font-size:23px;font-weight:900;color:var(--gold)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--panel);padding:9px 13px;border-radius:14px;font-weight:700}
main{max-width:1100px;margin:auto;padding:12px}
.panel{
 background:rgba(32,41,76,.96);border:1px solid #46588c;
 border-radius:22px;padding:20px;margin-bottom:16px;
 box-shadow:0 12px 35px #0002
}
h1,h2,h3{margin-top:0}
h1{font-size:clamp(25px,5vw,40px)}
.subtitle{color:var(--muted)}
button{
 border:0;border-radius:13px;padding:12px 17px;font-weight:800;
 background:var(--gold);color:#20213a;transition:.15s
}
button:hover{transform:translateY(-2px)}
button.secondary{background:#3b4b7c;color:white}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.hidden{display:none!important}
.classes,.map,.levels,.answers{display:grid;gap:12px}
.classes{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.map{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.levels{grid-template-columns:repeat(5,minmax(48px,1fr))}
.card{
 background:var(--panel2);padding:16px;border-radius:17px;
 border:1px solid #52669e;text-align:left
}
.card h3{margin-bottom:8px}
.card p{color:var(--muted);font-size:14px}
.lock{filter:grayscale(.6);opacity:.55}
.level{
 min-height:55px;background:#33436f;color:white;
 border:2px solid #52669e;padding:8px
}
.level.done{background:#176b58;border-color:var(--green)}
.level.current{border-color:var(--gold);box-shadow:0 0 0 3px #ffd16633}
.level.locked{opacity:.35}
.progress{
 height:10px;background:#10162e;border-radius:99px;overflow:hidden;margin:12px 0
}
.progress>div{height:100%;background:var(--green);width:0;transition:.3s}
.task-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tag{background:#394b7d;padding:7px 11px;border-radius:99px;font-size:13px}
.story{background:#172143;padding:14px;border-radius:15px;margin:12px 0}
.question{font-size:clamp(20px,4vw,28px);font-weight:800;line-height:1.4;margin:22px 0}
.answers{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.answer{
 background:#33436f;color:white;border:2px solid #52669e;
 min-height:65px;font-size:20px
}
.answer.correct{background:#176b58;border-color:var(--green)}
.answer.wrong{background:#7b2943;border-color:var(--red)}
.feedback{min-height:35px;font-weight:800;margin:12px 0}
.feedback.good{color:var(--green)}
.feedback.bad{color:var(--red)}
.drag-area{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.drag-item{
 background:#ffd166;color:#24213b;padding:14px 18px;border-radius:14px;
 font-weight:900;touch-action:none;user-select:none;cursor:grab
}
.drop{
 min-width:85px;min-height:65px;border:2px dashed #8ca2e4;
 border-radius:14px;display:grid;place-items:center;padding:8px
}
.drop.active{background:#324b7c}
.drop.filled{border-style:solid;border-color:var(--green)}
.finale-screen{
 background:linear-gradient(135deg,#473276,#203d72);
 border:1px solid #8b78c9;border-radius:20px;padding:20px
}
.miki{font-size:44px}
footer{text-align:center;color:var(--muted);padding:25px}
@media(max-width:600px){
 main{padding:8px}.panel{padding:15px}
 .levels{grid-template-columns:repeat(5,1fr)}
 header{padding:12px}
}
</style>
</head>
<body>
<header>
 <div class="logo">🕵️ Matematyczni Detektywi</div>
 <div class="stats">
  <div class="stat">⭐ XP: <span id="xp">0</span></div>
  <div class="stat">🏅 <span id="badges">0</span></div>
 </div>
</header>

<main>
<section id="home" class="panel">
 <h1>Witaj w Matematycznej Akademii!</h1>
 <p class="subtitle">Wybierz klasę i rozpocznij swoje matematyczne śledztwo.</p>
 <div class="classes">
  <button onclick="chooseGrade(1)">📘 Klasa 1</button>
  <button onclick="chooseGrade(2)">📗 Klasa 2</button>
  <button onclick="chooseGrade(3)">📕 Klasa 3</button>
 </div>
</section>

<section id="world" class="panel hidden">
 <button class="secondary" onclick="goHome()">← Klasy</button>
 <h1 id="worldTitle"></h1>
 <p class="subtitle">Krainy odblokowują się po ukończeniu poprzedniej.</p>
 <div id="map" class="map"></div>
</section>

<section id="levelsScreen" class="panel hidden">
 <button class="secondary" onclick="showWorld()">← Mapa krain</button>
 <h1 id="regionTitle"></h1>
 <p class="subtitle">10 poziomów • 7 zadań + finał</p>
 <div id="levels" class="levels"></div>
</section>

<section id="game" class="panel hidden">
 <div class="task-head">
  <button class="secondary" onclick="showLevels()">← Poziomy</button>
  <span class="tag" id="taskCounter"></span>
  <span class="tag" id="taskType"></span>
 </div>
 <div class="progress"><div id="bar"></div></div>
 <div id="gameContent"></div>
 <div id="feedback" class="feedback"></div>
 <button id="nextBtn" class="hidden" onclick="nextTask()">Dalej →</button>
</section>
</main>
<footer>🧠 Myśl • Odkrywaj • Rozwiązuj</footer>

<script>
const regions={
1:[
"Liczby i porządek","Obliczenia","Brakujące liczby","Geometria",
"Wielkości i długość","Czas","Pieniądze","Zadania tekstowe","Logiczne śledztwa"
],
2:[
"Liczby do 100","Obliczenia do 100","Mnożenie","Dzielenie",
"Brakujące liczby","Geometria","Miary","Czas i kalendarz",
"Pieniądze","Zadania tekstowe"
],
3:[
"Liczby do 1000","Dodawanie i odejmowanie","Mnożenie","Dzielenie",
"Niewiadome","Geometria","Jednostki miary","Czas i kalendarz",
"Finanse","Wielkie śledztwa"
]
};

const stories=[
"🦊 Lisek zgubił mapę. Pomóż mu odnaleźć drogę!",
"🐉 Smok pilnuje skarbu. Rozwiąż zagadkę, aby przejść dalej.",
"🧙 Czarodziej potrzebuje matematycznej pomocy.",
"🏰 Zamek zamknął bramę. Odkryj tajemniczy kod!",
"🔍 Miki znalazł ślady. Sprawdź, dokąd prowadzą."
];

let grade=1,region=0,level=1,task=0;
let currentTask=null,answered=false;
let data=JSON.parse(localStorage.getItem("md-save")||"{}");
data.xp=data.xp||0;data.done=data.done||{};data.badges=data.badges||{};
const key=(g,r,l)=>`${g}-${r}-${l}`;
function save(){
 localStorage.setItem("md-save",JSON.stringify(data));
 document.getElementById("xp").textContent=data.xp;
 document.getElementById("badges").textContent=Object.keys(data.badges).length;
}
save();

function chooseGrade(g){
 grade=g;document.getElementById("home").classList.add("hidden");
 showWorld();
}
function goHome(){
 document.getElementById("world").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
}
function showWorld(){
 hideAll();document.getElementById("world").classList.remove("hidden");
 document.getElementById("worldTitle").textContent="Klasa "+grade+" • Mapa przygód";
 const map=document.getElementById("map");map.innerHTML="";
 regions[grade].forEach((name,i)=>{
  const unlocked=i===0||regionDone(i-1);
  const completed=regionDone(i);
  const card=document.createElement("button");
  card.className="card "+(!unlocked?"lock":"");
  card.disabled=!unlocked;
  card.innerHTML=`<h3>${completed?"🏆":"🗺️"} ${name}</h3>
  <p>${unlocked?"10 poziomów do odkrycia":"🔒 Ukończ poprzednią krainę"}</p>`;
  card.onclick=()=>{region=i;showLevels()};
  map.appendChild(card);
 });
}
function regionDone(r){
 return Array.from({length:10},(_,i)=>data.done[key(grade,r,i+1)]).every(Boolean);
}
function hideAll(){
 ["home","world","levelsScreen","game"].forEach(id=>document.getElementById(id).classList.add("hidden"));
}
function showLevels(){
 hideAll();document.getElementById("levelsScreen").classList.remove("hidden");
 document.getElementById("regionTitle").textContent=regions[grade][region];
 const box=document.getElementById("levels");box.innerHTML="";
 for(let l=1;l<=10;l++){
  const unlocked=l===1||data.done[key(grade,region,l-1)];
  const done=data.done[key(grade,region,l)];
  const b=document.createElement("button");
  b.className="level "+(done?"done ":"")+(unlocked?"":"locked");
  b.textContent=done?"✓ "+l:l;
  b.disabled=!unlocked;
  b.onclick=()=>startLevel(l);
  box.appendChild(b);
 }
}
function startLevel(l){
 level=l;task=0;hideAll();
 document.getElementById("game").classList.remove("hidden");
 nextTask();
}
function rand(n){return Math.floor(Math.random()*n)}
function pick(a){return a[rand(a.length)]}
function numRange(){
 const max=grade===1?20:grade===2?100:1000;
 return Math.floor(Math.random()*max)+1;
}
function makeTask(){
 const topic=regions[grade][region];
 const type=task%7;
 let a,b,q,answer,options,kind="choice",story="";
 const max=grade===1?20:grade===2?100:1000;
 a=rand(grade===1?10:grade===2?50:500)+1;
 b=rand(grade===1?10:grade===2?30:300)+1;
 switch(type){
 case 0:
  q=`Ile wynosi ${a} + ${b}?`;answer=a+b;break;
 case 1:
  if(a<b)[a,b]=[b,a];
  q=`Oblicz: ${a} − ${b}`;answer=a-b;break;
 case 2:
  a=rand(10)+1;b=rand(10)+1;
  q=`Ile wynosi ${a} × ${b}?`;answer=a*b;break;
 case 3:
  a=rand(10)+1;b=rand(10)+1;
  q=`Podziel ${a*b} na ${a}.`;answer=b;break;
 case 4:
  a=rand(15)+1;b=rand(15)+1;
  q=`Uzupełnij: ${a} + □ = ${a+b}`;answer=b;break;
 case 5:
  a=rand(10)+1;b=rand(10)+1;
  q=`${pick(["Miki","Elf","Smok"])} ma ${a} kryształów. Dostaje ${b}. Ile ma razem?`;
  answer=a+b;story=pick(stories);break;
 default:
  a=rand(10)+1;b=rand(10)+1;
  q=`Zagadka: liczba jest większa od ${a}, mniejsza od ${a+3}. Wybierz ${a+1} lub ${a+2}.`;
  answer=a+1;options=[a+1,a+2];break;
 }
 if(!options){
  options=[answer,answer+rand(5)+1,Math.max(0,answer-rand(5)-1),answer+rand(10)+2];
 }
 options=[...new Set(options)];
 while(options.length<4)options.push(answer+options.length+rand(4)+1);
 options=options.sort(()=>Math.random()-.5);
 return {q,answer,options,story,kind};
}

function makeFinale(){
 return {
 q:"🏆 FINAŁ: Otwórz tajemniczy skarbiec!",
 story:"Miki zebrał wszystkie wskazówki. Teraz musi odkryć kod. Rozwiąż zagadkę:",
 answer:grade===1?7:grade===2?24:125,
 options:grade===1?[6,7,8,9]:grade===2?[20,24,26,28]:[120,125,130,135],
 finale:true
 };
}

function nextTask(){
 answered=false;
 document.getElementById("nextBtn").classList.add("hidden");
 document.getElementById("feedback").textContent="";
 document.getElementById("feedback").className="feedback";
 document.getElementById("bar").style.width=(task/8*100)+"%";
 document.getElementById("taskCounter").textContent=`Poziom ${level} • ${task+1}/8`;
 document.getElementById("taskType").textContent=task===7?"🏆 Finał":"🔎 Śledztwo";
 currentTask=task===7?makeFinale():makeTask();
 renderTask();
}
function renderTask(){
 const c=document.getElementById("gameContent");c.innerHTML="";
 if(currentTask.story){
  const s=document.createElement("div");s.className="story";
  s.textContent=currentTask.story;c.appendChild(s);
 }
 const q=document.createElement("div");q.className="question";
 q.textContent=currentTask.q;c.appendChild(q);
 const answers=document.createElement("div");answers.className="answers";
 currentTask.options.forEach(v=>{
  const b=document.createElement("button");b.className="answer";b.textContent=v;
  b.onclick=()=>check(v,b);answers.appendChild(b);
 });
 c.appendChild(answers);
}
function check(v,btn){
 if(answered)return;
 answered=true;
 const f=document.getElementById("feedback");
 if(v===currentTask.answer){
  f.textContent=task===7?"🏆 Finał ukończony! Kraina uratowana!":"✨ Doskonale! Dobra robota!";
  f.className="feedback good";
  data.xp+=task===7?100:10;
  document.querySelectorAll(".answer").forEach(b=>{
   if(Number(b.textContent)===currentTask.answer)b.classList.add("correct");
  });
 }else{
  f.textContent=`🔎 Spróbuj jeszcze raz! Poprawna odpowiedź: ${currentTask.answer}`;
  f.className="feedback bad";
  btn.classList.add("wrong");
  answered=false;
  return;
 }
 save();document.getElementById("nextBtn").classList.remove("hidden");
}
function nextTask(){
 if(task===7){
  data.done[key(grade,region,level)]=true;
  data.badges[key(grade,region,level)]=true;
  save();
  document.getElementById("gameContent").innerHTML=
   `<div class="finale-screen"><div class="miki">🕵️‍♂️</div>
   <h2>Kraina uratowana!</h2>
   <p>Zdobywasz 100 XP i odznakę!</p>
   <button onclick="showLevels()">Wróć do poziomów</button>
   <button onclick="showWorld()">Mapa krain</button></div>`;
  document.getElementById("feedback").textContent="";
  document.getElementById("nextBtn").classList.add("hidden");
  document.getElementById("bar").style.width="100%";
  return;
 }
 task++;nextTask();
}
</script>
</body>
</html>
